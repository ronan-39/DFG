# BARTS -> USC feature aggregation.
experiment_name: 'FA_UNet_BARTS_to_USC'
data_root: '/home/ronan/Documents/GitHub/DFG/data/speech_preproc'
save_root: '/home/ronan/Documents/GitHub/DFG/results/Target_Adapt'

# Replace this with the best source checkpoint produced by
# main_trainer_source.py.
source_model_path: '/home/ronan/Documents/GitHub/DFG/results/Source_Seg/UNet_BARTS_source_seg/REPLACE_WITH_SOURCE_CHECKPOINT.pth'

target_sites:
- 'USC'
resume_dir: ''
continue_train: False
total_epochs: 5
random_seed: 999

# Four foreground classes plus background.
organ_list:
- 'class_1'
- 'class_2'
- 'class_3'
- 'class_4'

# Dataloader settings
patient_level_dataloader: False
img_size:
- 256
- 256
batch_size: 16
num_workers: 8
eval_2d: True

# Model
arch: 'UNet'
use_prototype: False
update_prototype: False
input_dim: 3
feat_dim: 32
output_dim: 64
num_classes: 5
num_prototypes: 1

# Optim parameters
lr: 0.0001

# Loss parameters
nav_t: 1
beta: 0.001
s_par: 0.5

# Display and evaluation
save_steps: 10
eval_steps: 5
display_steps: 4000000
save_visuals: False
test: False
